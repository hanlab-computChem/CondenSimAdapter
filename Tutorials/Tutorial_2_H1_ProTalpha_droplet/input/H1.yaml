# CG Simulation Configuration
# Generated by: adapter init
#
# Available CG force fields:
#   - calvados: CALVADOS force field (default)
#   - hps_urry: HPS Urry model
#   - cocomo: COCOMO2
#   - mpipi_recharged: Mpipi_recharged
#
# Geometry types:
#   - grid: Continuous dense phase with periodic boundaries in x, y, z
#   - slab: Periodic boundaries in x, y and interfaces with dilute phase along z
#   - droplet: Spherical droplet confined within radius r, surrounded by dilute phase

# System information
system_name: H1

# CG force field
force_field: mpipi_recharged   # calvados | hps_urry | cocomo | mpipi_recharged

# Environment parameters
box: [12.0, 12.0, 50.0]   # nm (x, y, z)
temperature: 280      # Kelvin
ionic: 0.15                # Molar (ionic strength)

# Topology type:
#   - grid: Continuous dense phase with periodic boundaries in x, y, z.
#   - droplet: Spherical droplet confined within radius r, surrounded by dilute phase
#   - slab: Geometry with periodic boundaries in x, y and interfaces with dilute phase along z.
topol: slab

# CG simulation parameters
simulation:
  steps: 10000000   # 1000.0 ns (1 step = 10 fs)
  wfreq: 5000        # write frequency - save per 50 ps
  verbose: true

# Component definitions
components:
  - name: prota
    type: IDP          # IDP or MDP
    nmol: 24          # number of molecules (can be adjusted per component)
    ffasta: prota.fasta

  - name: H1
    type: MDP          # IDP or MDP
    nmol: 20           # number of molecules (can be adjusted per component)
    fpdb: H1.pdb
    # Domain definitions (required for MDP with restraints):
    fdomains: |
      H1:
      - [22, 96]
    restraint: true
    restraint_type: harmonic  # harmonic | go
    charge_termini: both  # both | n | c | none
