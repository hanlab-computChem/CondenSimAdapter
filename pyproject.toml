[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CondenSimAdapter"
version = "1.0.2.2b"
description = "General purpose simulation builder for protein condenstate systems compatible with most of popular coarse-grained and all-atom forcefields"
authors = [{ name = "Xiaojing Tian", email = "tianxj15@tsinghua.org" }]
license = { text = "GPL-3.0" }
requires-python = ">=3.10,<3.12"
readme = "README.md"
keywords = ["protein", "condensate", "simulation", "coarse-grained", "molecular-dynamics", "openmm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Full dependencies - includes everything (requires CUDA for ML features)
dependencies = [
    "click>=8.0",
    "click-option-group>=0.5",
    "pyyaml>=6.0",
    "numpy>=1.26,<2.0",
    "tqdm>=4.0",
    "pydantic>=2.0",
    "openmm[cuda12]>=8.2",  # AMD GPU users may replace cuda12 with hip6/hip7; CPU-only: plain openmm>=8.2
    "mdtraj>=1.10",
    "MDAnalysis>=2.6,<3.0",
    "biopython>=1.81",
    "parmed",
    "gromacswrapper",
    "scipy>=1.10",
    "matplotlib>=3.5",
    "networkx>=2.8",
    "numba>=0.60",
    "jinja2",
    "statsmodels",
    "PeptideConstructor",
    "torch>=2.4,<2.5",
    "dgl>=2.4",
    "e3nn>=0.5",
    "torchdata>=0.11,<0.12",
    "ml-collections>=0.1",
]

[project.optional-dependencies]

# Development dependencies
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
    "black",
    "mypy",
]

[project.scripts]
adapter = "CondenSimAdapter.cli:main"

[project.urls]
Homepage = "https://github.com/hanlab-computChem/CondenSimAdapter"
Documentation = "https://github.com/hanlab-computChem/CondenSimAdapter#readme"
Repository = "https://github.com/hanlab-computChem/CondenSimAdapter"
Issues = "https://github.com/hanlab-computChem/CondenSimAdapter/issues"
Changelog = "https://github.com/hanlab-computChem/CondenSimAdapter/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["CondenSimAdapter*"]
exclude = ["tests*", "docs*", "old_code*", "consisitency*", ".github*"]

[tool.setuptools.exclude-package-data]
CondenSimAdapter = ["**/__pycache__", "**/*.pyc", "**/*.pyo"]

[tool.setuptools.package-data]
CondenSimAdapter = [
    "forcefield/**/*.itp",
    "forcefield/**/*.ff/**/*",
    "core/forcefield/data/*",
    "backmap/cg2all/data/*",
    # Model files (.ckpt) are NOT included - downloaded from GitHub Release at runtime
    "backmap/cg2all/model/.gitkeep",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -W ignore"
markers = [
    "slow: long-running tests",
    "gpu: tests requiring GPU",
    "gmx: tests requiring GROMACS",
]
