[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "CondenSimAdapter"
version = "0.2.0"
description = "Automated CG-to-AA workflow for protein condensate simulations."
authors = [{ name = "Xiaojing Tian", email = "tianxj15@tsinghua.org" }]
license = { text = "GPL-3.0" }
requires-python = "==3.11.*"

# Core runtime dependencies.
# Heavy scientific packages (openmm, torch, dgl) must be installed via
# the conda/pip channel specified in install.sh because they require
# CUDA-matched builds.  Only lightweight deps are listed here.
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "tqdm>=4.0",
    "click-option-group>=0.5",
]

[project.optional-dependencies]
# Full scientific stack (install with: pip install -e ".[sim]")
sim = [
    "openmm>=8.2",
    "mdtraj>=1.10",
    "MDAnalysis>=2.6",
    "biopython>=1.81",
    "parmed",
    "gromacswrapper",
    "scipy",
]
ml = [
    # Neural backmapping; requires matching CUDA build
    "torch>=2.1",
    "dgl>=2.1",
    "e3nn>=0.5",
]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
]

[project.scripts]
adapter = "CondenSimAdapter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["CondenSimAdapter*"]

[tool.setuptools.package-data]
CondenSimAdapter = [
    "forcefield/**/*",
    "core/forcefield/data/*",
    "backmap/cg2all/data/*",
    "backmap/cg2all/model/*.ckpt",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -W ignore"
markers = ["slow: long-running tests"]
